version: '3.9'

services:
  # Frontend - React Canvas UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: thread-node-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:8000
      - REACT_APP_WS_URL=ws://backend:8000
    depends_on:
      - backend
    networks:
      - thread-node-network
    restart: unless-stopped

  # Backend - A2A Gateway & Orchestration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: thread-node-backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://thread:${POSTGRES_PASSWORD:-thread123}@postgres:5432/threadnode
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - OLLAMA_DEFAULT_INSTANCE=http://ollama:11434
      - OLLAMA_INSTANCES=http://ollama:11434
      - A2A_PROTOCOL_VERSION=0.3
      - JWT_SECRET=${JWT_SECRET:-change-this-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - thread-node-network
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # OLLAMA - Local LLM Inference
  ollama:
    image: ollama/ollama:latest
    container_name: thread-node-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - thread-node-network
    restart: unless-stopped
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL - State Persistence
  postgres:
    image: postgres:16-alpine
    container_name: thread-node-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=threadnode
      - POSTGRES_USER=thread
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-thread123}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - thread-node-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thread -d threadnode"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Message Queue
  redis:
    image: redis:7-alpine
    container_name: thread-node-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    networks:
      - thread-node-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  thread-node-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ollama-models:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
